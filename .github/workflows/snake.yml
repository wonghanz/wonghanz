name: Contribution grid snake

# Renders the contribution graph as an animated SVG on the `output` branch.
# The README reads it straight from raw.githubusercontent.com, so no image is
# committed to the profile repo itself.

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render snake
        uses: Platane/snk@v3
        with:
          github_user_name: wonghanz
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Gild the snake
        run: node tools/gild-snake.mjs dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake-dark.svg

      - name: Publish to output branch
        uses: peaceiris/actions-gh-pages@v3.9.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
