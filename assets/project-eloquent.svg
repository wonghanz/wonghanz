<svg xmlns="http://www.w3.org/2000/svg" width="560" height="232" viewBox="0 0 560 232" role="img" aria-label="Eloquent Lab - Native iOS + Android exam-prep SaaS">
  <defs>
    <linearGradient id="bg0" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070f"/><stop offset="0.5" stop-color="#0a1030"/><stop offset="1" stop-color="#05070f"/>
    </linearGradient>
    <radialGradient id="a0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.5"/><stop offset="0.6" stop-color="#22d3ee" stop-opacity="0.09"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="b0"><stop offset="0" stop-color="#3b82f6" stop-opacity="0.45"/><stop offset="0.6" stop-color="#3b82f6" stop-opacity="0.08"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass0" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/><stop offset="0.55" stop-color="#ffffff" stop-opacity="0.04"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="chip0" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.15"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="shine0" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.14"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title0" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#f6fbff"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="blur0" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="22"/></filter>
    <clipPath id="clip0"><rect x="1" y="1" width="558" height="230" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#clip0)">
    <rect width="560" height="232" fill="url(#bg0)"/>
    <circle cx="118" cy="34" r="150" fill="url(#a0)"><animate attributeName="cx" values="118;190;118" dur="16s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></circle>
    <circle cx="510" cy="252" r="140" fill="url(#b0)"><animate attributeName="cy" values="252;190;252" dur="19s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/></circle>
    <g clip-path="url(#clip0)">
      <g filter="url(#blur0)"><circle cx="118" cy="34" r="150" fill="url(#a0)"/><circle cx="510" cy="252" r="140" fill="url(#b0)"/><rect width="560" height="232" fill="#060a1a" opacity="0.66"/></g>
      <rect width="560" height="232" fill="url(#glass0)"/>
      <rect x="-220" y="0" width="150" height="232" fill="url(#shine0)" transform="skewX(-18)">
        <animate attributeName="x" values="-240;620" dur="8s" begin="0.0s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0 0.3 1" keyTimes="0;1"/>
      </rect>
    </g>
    <rect x="1" y="1" width="558" height="230" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.3"/>
    <rect x="70" y="1.6" width="420" height="1.2" fill="#ffffff" opacity="0.4"/>

    <!-- droplet mark -->
    <g transform="translate(24,24)">
      <circle cx="15" cy="15" r="14" fill="url(#a0)"/>
      <circle cx="15" cy="15" r="11" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.55"/>
      <ellipse cx="11" cy="10.5" rx="3.6" ry="2.3" fill="#ffffff" fill-opacity="0.85" transform="rotate(-28 11 10.5)"/>
      <circle cx="15" cy="15" r="14" fill="none" stroke="#22d3ee" stroke-opacity="0.6">
        <animate attributeName="r" values="14;24" dur="3s" begin="0.0s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.6;0" dur="3s" begin="0.0s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="62" y="44" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="800" letter-spacing="0.2" fill="url(#title0)">Eloquent Lab</text>
    <text x="62" y="66" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#9fb3cf">Native iOS + Android exam-prep SaaS</text>
    <line x1="24" y1="90" x2="536" y2="90" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="24" y="108" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="9.5" font-weight="700" letter-spacing="2" fill="#8399b8">SHIPPED IMPACT</text>
    <rect x="24" y="118" width="77" height="26" rx="13" fill="url(#chip0)" stroke="#22d3ee" stroke-opacity="0.34"/>
      <text x="62.5" y="135" text-anchor="middle" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="700" fill="#e6f2ff">100+ MAU</text>
      <rect x="109" y="118" width="160" height="26" rx="13" fill="url(#chip0)" stroke="#22d3ee" stroke-opacity="0.34"/>
      <text x="189" y="135" text-anchor="middle" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="700" fill="#e6f2ff">-90% grading latency</text>
      <rect x="277" y="118" width="105" height="26" rx="13" fill="url(#chip0)" stroke="#22d3ee" stroke-opacity="0.34"/>
      <text x="329.5" y="135" text-anchor="middle" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="700" fill="#e6f2ff">RM0 ad spend</text>
    <text x="24" y="200" font-family="ui-monospace,'SFMono-Regular',Consolas,monospace" font-size="11" fill="#7f93b0">wonghanz/Eloquent-Lab</text>
    <text x="24" y="176" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" letter-spacing="0.4" fill="#7f93b0">SwiftUI</text>
    <text x="76" y="176" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#3d4d66">/</text><text x="87" y="176" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" letter-spacing="0.4" fill="#7f93b0">Jetpack Compose</text>
    <text x="187" y="176" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#3d4d66">/</text><text x="198" y="176" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" letter-spacing="0.4" fill="#7f93b0">RevenueCat</text>
    <text x="268" y="176" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" fill="#3d4d66">/</text><text x="279" y="176" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="10.5" letter-spacing="0.4" fill="#7f93b0">DeepSeek</text>
    <g>
      <text x="506" y="205" text-anchor="end" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#22d3ee">OPEN SOURCE</text>
      <path d="M514 200 h20 m-6 -6 l6 6 l-6 6" fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <animate attributeName="stroke-opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
