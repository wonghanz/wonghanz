<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="46" viewBox="0 0 1000 46" role="img" aria-label="divider">
  <defs>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.95"/>
      <stop offset="0.8" stop-color="#f472b6" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-300%" width="200%" height="900%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect y="22" width="1000" height="1.6" fill="url(#rule)" filter="url(#g)"/>
  <!-- travelling droplet + its ripples -->
  <g>
    <circle cy="23" r="5" fill="#e0f7ff" filter="url(#g)">
      <animate attributeName="cx" values="60;940" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1" keyTimes="0;1"/>
    </circle>
    <g fill="none" stroke="#a5f3fc" stroke-width="1.2">
      <ellipse rx="6" ry="2" cy="23" opacity="0">
        <animate attributeName="cx" values="60;940" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1" keyTimes="0;1"/>
        <animate attributeName="opacity" values="0;0.85;0" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="rx" values="4;40" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="1.5;8" dur="1.5s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="6" ry="2" cy="23" opacity="0">
        <animate attributeName="cx" values="60;940" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1" keyTimes="0;1"/>
        <animate attributeName="opacity" values="0;0.6;0" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
        <animate attributeName="rx" values="4;40" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="1.5;8" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>
</svg>
