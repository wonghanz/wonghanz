<svg viewBox="0 0 1200 700" width="1200" height="700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Where I am. Nested reach from Bayan Lepas out to Southeast Asia, then ten current-position lines covering role, prior role, studies, leadership, learning, chemistry, teaching, national ranking, community and contact">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.2" r="1">
      <stop offset="0" stop-color="#101a3d"/><stop offset="0.55" stop-color="#0a1128"/><stop offset="1" stop-color="#050810"/>
    </radialGradient>
    <radialGradient id="oGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fcd34d" stop-opacity="0.95"/><stop offset="1" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="oCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38e0f8" stop-opacity="0.85"/><stop offset="1" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="oViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.8"/><stop offset="1" stop-color="#4c1d95" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="oPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fb7185" stop-opacity="0.7"/><stop offset="1" stop-color="#9f1239" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="glassFill" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="glassStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="topEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- travelling highlight: the middle stop sweeps, so gold reads as polished metal -->
    <linearGradient id="goldA" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#c2680c"/>
      <stop offset="0.3" stop-color="#fffbe6">
        <animate attributeName="offset" values="-0.3;1.3" dur="3.4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="goldB" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="0.3" stop-color="#ffffff">
        <animate attributeName="offset" values="-0.3;1.3" dur="4.6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="goldC" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#a16207"/>
      <stop offset="0.3" stop-color="#fef3c7">
        <animate attributeName="offset" values="-0.3;1.3" dur="5.8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="tierTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="tierSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#431407" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="pinGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbe6" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <filter id="blurL" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
    <clipPath id="frameClip"><rect x="0" y="0" width="1200" height="700" rx="28"/></clipPath>
    <clipPath id="panelClip"><rect x="36" y="36" width="1128" height="628" rx="28"/></clipPath>

    <style>
      .lbl{font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:15px;letter-spacing:0.2px;fill:#fff8e1}
      .det{font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif;font-weight:400;font-size:13px;fill:#dbe9fb}
      .tier{font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:16px;fill:#fff8e1}
      .tierDet{font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif;font-weight:400;font-size:12.5px;fill:#c6d8f0}
      .cap{font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif;font-weight:600;font-size:11px;letter-spacing:2.2px;fill:#a8c0dd}
    </style>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect width="1200" height="700" fill="url(#bg)"/>
    <g filter="url(#blurL)">
      <circle cx="150" cy="70" r="200" fill="url(#oCyan)"/>
      <circle cx="1090" cy="130" r="220" fill="url(#oGold)"/>
      <circle cx="620" cy="660" r="250" fill="url(#oViolet)"/>
      <circle cx="1000" cy="600" r="180" fill="url(#oPink)"/>
    </g>

    <g clip-path="url(#panelClip)">
      <rect x="36" y="36" width="1128" height="628" fill="#070c1c" opacity="0.62"/>
      <g filter="url(#blurL)" opacity="0.46">
        <circle cx="200" cy="120" r="210" fill="url(#oCyan)"/>
        <circle cx="1040" cy="140" r="220" fill="url(#oGold)"/>
        <circle cx="600" cy="620" r="250" fill="url(#oViolet)"/>
      </g>
      <rect x="36" y="36" width="1128" height="628" fill="url(#glassFill)"/>
      <rect x="-320" y="36" width="180" height="628" fill="url(#shine)" transform="skewX(-16)">
        <animate attributeName="x" values="-360;1240" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0 0.3 1" keyTimes="0;1"/>
      </rect>
    </g>
    <rect x="36" y="36" width="1128" height="628" rx="28" fill="none" stroke="url(#glassStroke)" stroke-width="1.4"/>
    <rect x="120" y="36.8" width="960" height="1.3" fill="url(#topEdge)"/>

    <text x="76" y="86" class="cap">REACH, NESTED OUTWARD</text>

