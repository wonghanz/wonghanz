    <g>
      <path d="M86 190 L250 272 L250 286 L86 204 Z" fill="url(#tierSide)"/>
      <path d="M414 190 L250 272 L250 286 L414 204 Z" fill="#7c2d12" opacity="0.6"/>
      <path d="M250 108 L414 190 L250 272 L86 190 Z" fill="url(#tierTop)" stroke="#fcd34d" stroke-opacity="0.55" stroke-width="1.2"/>
      <path d="M122 190 L250 254 L250 268 L122 204 Z" fill="url(#tierSide)"/>
      <path d="M378 190 L250 254 L250 268 L378 204 Z" fill="#7c2d12" opacity="0.6"/>
      <path d="M250 126 L378 190 L250 254 L122 190 Z" fill="url(#tierTop)" stroke="#fde68a" stroke-opacity="0.6" stroke-width="1.2"/>
      <path d="M158 190 L250 236 L250 250 L158 204 Z" fill="url(#tierSide)"/>
      <path d="M342 190 L250 236 L250 250 L342 204 Z" fill="#7c2d12" opacity="0.6"/>
      <path d="M250 144 L342 190 L250 236 L158 190 Z" fill="url(#tierTop)" stroke="#fef3c7" stroke-opacity="0.7" stroke-width="1.2"/>
      <path d="M194 190 L250 218 L250 232 L194 204 Z" fill="url(#tierSide)"/>
      <path d="M306 190 L250 218 L250 232 L306 204 Z" fill="#7c2d12" opacity="0.6"/>
      <path d="M250 162 L306 190 L250 218 L194 190 Z" fill="#fcd34d" fill-opacity="0.46" stroke="#fffbe6" stroke-opacity="0.9" stroke-width="1.3"/>

      <!-- expanding ripple, drawn around its own origin so scale stays centred -->
      <g transform="translate(250,190)">
        <path d="M0 -28 L56 0 L0 28 L-56 0 Z" fill="none" stroke="#fde68a" stroke-width="1.4">
          <animateTransform attributeName="transform" type="scale" values="1;2.1" dur="3.6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.8;0" dur="3.6s" repeatCount="indefinite"/>
          <animate attributeName="stroke-width" values="1.4;0.3" dur="3.6s" repeatCount="indefinite"/>
        </path>
      </g>

      <circle cx="250" cy="176" r="26" fill="url(#pinGlow)">
        <animate attributeName="r" values="22;32;22" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <path d="M250 158 c-8 0 -13 6 -13 12 c0 8 13 18 13 18 s13 -10 13 -18 c0 -6 -5 -12 -13 -12 z" fill="url(#goldA)" stroke="#fffbe6" stroke-opacity="0.6" stroke-width="0.8"/>
      <circle cx="250" cy="170" r="4" fill="#3b2509"/>
    </g>

    <!-- ── nested rows, innermost first ── -->
