      <path d="M342 190 L450 200" stroke="#fcd34d" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="3 4"/>
      <path d="M378 190 L450 250" stroke="#fbbf24" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="3 4"/>
      <path d="M414 190 L450 300" stroke="#eab308" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="3 4"/>

      <circle cx="458" cy="150" r="3.5" fill="url(#goldA)"/>
