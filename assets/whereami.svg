<svg viewBox="0 0 1200 600" width="1200" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Where I am: nested scope from Bayan Lepas out to Southeast Asia, plus current role, prior role, studies, learning focus, community and contact">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.2" r="1">
      <stop offset="0" stop-color="#0d1533"/><stop offset="0.55" stop-color="#070c20"/><stop offset="1" stop-color="#04070f"/>
    </radialGradient>
    <radialGradient id="oGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.85"/><stop offset="1" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="oCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.75"/><stop offset="1" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="oViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.7"/><stop offset="1" stop-color="#4c1d95" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="glassFill" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="glassStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="topEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chipFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- travelling highlight: the middle stop sweeps, so gold reads as polished metal -->
    <linearGradient id="goldA" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="0.3" stop-color="#fff6cf">
        <animate attributeName="offset" values="-0.3;1.3" dur="3.4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="goldB" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="0.3" stop-color="#fffaf0">
        <animate attributeName="offset" values="-0.3;1.3" dur="4.6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="goldC" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#92400e"/>
      <stop offset="0.3" stop-color="#fde68a">
        <animate attributeName="offset" values="-0.3;1.3" dur="5.8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="tierTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#78350f" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="tierSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b45309" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#431407" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="pinGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7d6" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <filter id="blurL" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frameClip"><rect x="0" y="0" width="1200" height="600" rx="28"/></clipPath>
    <clipPath id="panelClip"><rect x="36" y="36" width="1128" height="528" rx="28"/></clipPath>

    <style>
      .lbl{font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:15px;letter-spacing:0.2px}
      .det{font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif;font-weight:400;font-size:13px;fill:#c3d3ea}
      .tier{font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:16px;fill:#fff2cc}
      .tierDet{font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif;font-weight:400;font-size:12.5px;fill:#a9bcd6}
      .cap{font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif;font-weight:600;font-size:11px;letter-spacing:2.2px;fill:#8fa6c4}
    </style>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect width="1200" height="600" fill="url(#bg)"/>
    <g filter="url(#blurL)">
      <circle cx="150" cy="60" r="190" fill="url(#oCyan)"/>
      <circle cx="1080" cy="120" r="210" fill="url(#oGold)"/>
      <circle cx="620" cy="520" r="230" fill="url(#oViolet)"/>
    </g>

    <g clip-path="url(#panelClip)">
      <rect x="36" y="36" width="1128" height="528" fill="#050813" opacity="0.74"/>
      <g filter="url(#blurL)" opacity="0.4">
        <circle cx="200" cy="120" r="210" fill="url(#oCyan)"/>
        <circle cx="1040" cy="140" r="220" fill="url(#oGold)"/>
        <circle cx="600" cy="500" r="240" fill="url(#oViolet)"/>
      </g>
      <rect x="36" y="36" width="1128" height="528" fill="url(#glassFill)"/>
      <rect x="-320" y="36" width="180" height="528" fill="url(#shine)" transform="skewX(-16)">
        <animate attributeName="x" values="-360;1240" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0 0.3 1" keyTimes="0;1"/>
      </rect>
    </g>
    <rect x="36" y="36" width="1128" height="528" rx="28" fill="none" stroke="url(#glassStroke)" stroke-width="1.4"/>
    <rect x="120" y="36.8" width="960" height="1.3" fill="url(#topEdge)"/>

    <text x="76" y="86" class="cap">REACH, NESTED OUTWARD</text>

    <!-- ── isometric tier stack: innermost = home base ── -->
    <g>
      <!-- tier 4 (outermost) -->
      <path d="M86 190 L250 272 L250 286 L86 204 Z" fill="url(#tierSide)"/>
      <path d="M414 190 L250 272 L250 286 L414 204 Z" fill="#431407" opacity="0.55"/>
      <path d="M250 108 L414 190 L250 272 L86 190 Z" fill="url(#tierTop)" stroke="#fbbf24" stroke-opacity="0.42" stroke-width="1.2"/>
      <!-- tier 3 -->
      <path d="M122 190 L250 254 L250 268 L122 204 Z" fill="url(#tierSide)"/>
      <path d="M378 190 L250 254 L250 268 L378 204 Z" fill="#431407" opacity="0.55"/>
      <path d="M250 126 L378 190 L250 254 L122 190 Z" fill="url(#tierTop)" stroke="#fcd34d" stroke-opacity="0.5" stroke-width="1.2"/>
      <!-- tier 2 -->
      <path d="M158 190 L250 236 L250 250 L158 204 Z" fill="url(#tierSide)"/>
      <path d="M342 190 L250 236 L250 250 L342 204 Z" fill="#431407" opacity="0.55"/>
      <path d="M250 144 L342 190 L250 236 L158 190 Z" fill="url(#tierTop)" stroke="#fde68a" stroke-opacity="0.6" stroke-width="1.2"/>
      <!-- tier 1 (innermost) -->
      <path d="M194 190 L250 218 L250 232 L194 204 Z" fill="url(#tierSide)"/>
      <path d="M306 190 L250 218 L250 232 L306 204 Z" fill="#431407" opacity="0.55"/>
      <path d="M250 162 L306 190 L250 218 L194 190 Z" fill="#fbbf24" fill-opacity="0.34" stroke="#fff2cc" stroke-opacity="0.8" stroke-width="1.3"/>

      <!-- expanding ripple on the top tier: drawn around its own origin so scale stays centred -->
      <g transform="translate(250,190)">
        <path d="M0 -28 L56 0 L0 28 L-56 0 Z" fill="none" stroke="#fde68a" stroke-width="1.4">
          <animateTransform attributeName="transform" type="scale" values="1;2.1" dur="3.6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.7;0" dur="3.6s" repeatCount="indefinite"/>
          <animate attributeName="stroke-width" values="1.4;0.3" dur="3.6s" repeatCount="indefinite"/>
        </path>
      </g>

      <!-- home pin -->
      <circle cx="250" cy="176" r="26" fill="url(#pinGlow)">
        <animate attributeName="r" values="22;30;22" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <path d="M250 158 c-8 0 -13 6 -13 12 c0 8 13 18 13 18 s13 -10 13 -18 c0 -6 -5 -12 -13 -12 z" fill="url(#goldA)" stroke="#fff6cf" stroke-opacity="0.55" stroke-width="0.8"/>
      <circle cx="250" cy="170" r="4" fill="#3b2509"/>
    </g>

    <!-- ── nested rows, innermost first ── -->
    <g>
      <path d="M306 190 L450 150" stroke="#fde68a" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="3 4"/>
      <path d="M342 190 L450 200" stroke="#fcd34d" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="3 4"/>
      <path d="M378 190 L450 250" stroke="#fbbf24" stroke-opacity="0.38" stroke-width="1" stroke-dasharray="3 4"/>
      <path d="M414 190 L450 300" stroke="#d97706" stroke-opacity="0.38" stroke-width="1" stroke-dasharray="3 4"/>
      <circle cx="458" cy="150" r="3.5" fill="url(#goldA)"/>
      <text x="472" y="155" class="tier">Bayan Lepas, Penang</text>
      <text x="472" y="174" class="tierDet">home base — field hardware is built and tested here</text>

      <circle cx="458" cy="200" r="3.5" fill="url(#goldB)"/>
      <text x="472" y="205" class="tier">Penang &amp; Kedah</text>
      <text x="472" y="224" class="tierDet">live deployments — transit terminal, livestock farm, exam-prep classrooms</text>

      <circle cx="458" cy="250" r="3.5" fill="url(#goldC)"/>
      <text x="472" y="255" class="tier">Malaysia</text>
      <text x="472" y="274" class="tierDet">RM 100,000 Cradle CIP Spark grant architecture · #1 of 18 national colleges</text>

      <circle cx="458" cy="300" r="3.5" fill="url(#goldA)"/>
      <text x="472" y="305" class="tier">Southeast Asia</text>
      <text x="472" y="324" class="tierDet">EcoRise SEA Challenge 2026 Champion · 4 gold medals abroad since 2023</text>
    </g>

    <path d="M76 356 H1124" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>
    <circle cx="600" cy="356" r="5" fill="url(#goldA)"/>
    <text x="76" y="386" class="cap">CURRENT POSITION</text>

    <!-- ── status rows: gold icons, animated shine ── -->
    <g>
      <!-- telescope: now -->
      <g transform="translate(76,404)">
        <path d="M2 12.5 L13.5 4 L17 8.6 L5.5 17 Z" fill="url(#goldA)"/>
        <path d="M14.5 3 L19 8.4" stroke="url(#goldB)" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M8 15 L5 21 M10.5 15.5 L14 21" stroke="url(#goldC)" stroke-width="1.7" stroke-linecap="round"/>
      </g>
      <text x="112" y="414" class="lbl" fill="#fff2cc">Now</text>
      <text x="112" y="432" class="det">Lead Mobile SaaS &amp; Growth Engineer — Eloquent Lab, remote</text>

      <!-- bricks: before -->
      <g transform="translate(660,404)">
        <rect x="1" y="3" width="9" height="5.5" rx="1" fill="url(#goldB)"/>
        <rect x="12" y="3" width="9" height="5.5" rx="1" fill="url(#goldA)"/>
        <rect x="1" y="10" width="6" height="5.5" rx="1" fill="url(#goldC)"/>
        <rect x="8.5" y="10" width="7" height="5.5" rx="1" fill="url(#goldA)"/>
        <rect x="17" y="10" width="4" height="5.5" rx="1" fill="url(#goldB)"/>
        <rect x="4" y="17" width="14" height="4" rx="1" fill="url(#goldC)"/>
      </g>
      <text x="696" y="414" class="lbl" fill="#fff2cc">Before that</text>
      <text x="696" y="432" class="det">AI Engineer &amp; Grant Research Lead — IoT Services Sdn. Bhd.</text>

      <!-- graduation cap: studying -->
      <g transform="translate(76,452)">
        <path d="M11 3 L21.5 8 L11 13 L0.5 8 Z" fill="url(#goldA)"/>
        <path d="M4.5 10.5 v4.2 c0 2.2 13 2.2 13 0 v-4.2" fill="none" stroke="url(#goldB)" stroke-width="1.9"/>
        <path d="M20 9.2 v6" stroke="url(#goldC)" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="20" cy="16.4" r="1.6" fill="url(#goldC)"/>
      </g>
      <text x="112" y="462" class="lbl" fill="#fff2cc">Studying</text>
      <text x="112" y="480" class="det">B.Sc. Computer Science, Systems &amp; Networks — Universiti Malaya, 2030 · 4.00 matric CGPA</text>

      <!-- colonnade: community -->
      <g transform="translate(660,452)">
        <path d="M11 1.5 L21.5 7.5 H0.5 Z" fill="url(#goldA)"/>
        <rect x="2" y="8.4" width="18" height="2" rx="0.7" fill="url(#goldB)"/>
        <rect x="3.6" y="11.6" width="2.6" height="6.6" rx="0.8" fill="url(#goldC)"/>
        <rect x="8.1" y="11.6" width="2.6" height="6.6" rx="0.8" fill="url(#goldA)"/>
        <rect x="12.6" y="11.6" width="2.6" height="6.6" rx="0.8" fill="url(#goldB)"/>
        <rect x="17.1" y="11.6" width="2.6" height="6.6" rx="0.8" fill="url(#goldC)"/>
        <rect x="1.4" y="19.2" width="19.2" height="2.2" rx="0.8" fill="url(#goldA)"/>
      </g>
      <text x="696" y="462" class="lbl" fill="#fff2cc">Community</text>
      <text x="696" y="480" class="det">founded STEMgineers Club at KMKK — 100+ trained, 20 gold teams mentored</text>

      <!-- seedling: learning -->
      <g transform="translate(76,500)">
        <path d="M11 21 V11" stroke="url(#goldC)" stroke-width="1.9" stroke-linecap="round"/>
        <path d="M10.4 12.5 C4.5 12.5 2.5 9 2.5 4.8 C8 5.2 10.4 8.2 10.4 12.5 Z" fill="url(#goldA)"/>
        <path d="M12.4 11 C17.6 11 19.6 8 19.6 4.4 C14.6 4.8 12.4 7.4 12.4 11 Z" fill="url(#goldB)"/>
      </g>
      <text x="112" y="510" class="lbl" fill="#fff2cc">Learning</text>
      <text x="112" y="528" class="det">real-time DSP for speech scoring · local-first inference under one network call</text>

      <!-- envelope: reach -->
      <g transform="translate(660,500)">
        <rect x="1" y="4.5" width="20" height="14" rx="2.4" fill="url(#goldB)"/>
        <path d="M1.8 6 L11 13.2 L20.2 6" fill="none" stroke="#3b2509" stroke-opacity="0.55" stroke-width="1.6"/>
      </g>
      <text x="696" y="510" class="lbl" fill="#fff2cc">Reach me</text>
      <text x="696" y="528" class="det">wonghanz2007@gmail.com — open to systems/AIoT roles and research work</text>
    </g>

    <rect x="0.7" y="0.7" width="1198.6" height="598.6" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.13"/>
  </g>
</svg>
