        <path d="M11 4.6 a3.3 3.3 0 1 0 0 6.6 a3.3 3.3 0 1 0 0 -6.6 z" fill="#3b2509" opacity="0.5"/>
        <path d="M7.4 13 L5 21 l6 -2.6 6 2.6 -2.4 -8" fill="url(#goldC)"/>
      </g>
      <text x="696" y="454" class="lbl">Teaching</text>
      <text x="696" y="472" class="det">trained 40+ peer educators · built the "PAL ExScience" method</text>

      <!-- graduation cap: studying -->
      <g transform="translate(76,489)">
        <path d="M11 3 L21.5 8 L11 13 L0.5 8 Z" fill="url(#goldA)"/>
        <path d="M4.5 10.5 v4.2 c0 2.2 13 2.2 13 0 v-4.2" fill="none" stroke="url(#goldB)" stroke-width="1.9"/>
        <path d="M20 9.2 v6" stroke="url(#goldC)" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="20" cy="16.4" r="1.6" fill="url(#goldC)"/>
      </g>
      <text x="112" y="502" class="lbl">Studying</text>
      <text x="112" y="520" class="det">B.Sc. Computer Science — Universiti Malaya, 2030 · flat 4.00 CGPA · MUET Band 4</text>

