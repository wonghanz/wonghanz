        <circle cx="12.6" cy="17.2" r="0.8" fill="#fffbe6" opacity="0.7"/>
        <path d="M8 1.5 h6" stroke="url(#goldC)" stroke-width="1.8" stroke-linecap="round"/>
      </g>
      <text x="696" y="406" class="lbl">Chemistry</text>
      <text x="696" y="424" class="det">PAL Chemistry Lead — AI modules for abstract chemical concepts</text>

