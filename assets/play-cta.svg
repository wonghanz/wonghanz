<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="164" viewBox="0 0 1200 164" role="img" aria-label="Try the interactive water pond: live WebGL ripples, spatial ocean audio and a droplet game, at wonghanz.github.io/playground">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04070f"/>
      <stop offset="0.45" stop-color="#08152e"/>
      <stop offset="1" stop-color="#04070f"/>
    </linearGradient>
    <radialGradient id="glowC"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/><stop offset="0.6" stop-color="#22d3ee" stop-opacity="0.09"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowV"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.5"/><stop offset="0.6" stop-color="#a78bfa" stop-opacity="0.08"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowA"><stop offset="0" stop-color="#fb923c" stop-opacity="0.42"/><stop offset="0.6" stop-color="#fb923c" stop-opacity="0.07"/><stop offset="1" stop-color="#fb923c" stop-opacity="0"/></radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0.28" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0" stop-color="#f4fbff"/>
      <stop offset="0.55" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <clipPath id="cut"><rect x="1" y="1" width="1198" height="162" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#cut)">
    <rect width="1200" height="164" fill="url(#sea)"/>

    <circle cx="1060" cy="40" r="150" fill="url(#glowC)">
      <animate attributeName="cx" values="1060;1140;1060" dur="21s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="150" r="140" fill="url(#glowV)">
      <animate attributeName="cy" values="150;96;150" dur="26s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="170" r="120" fill="url(#glowA)">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- frosted copy: static blurred bleed, never an animated feGaussianBlur -->
    <g clip-path="url(#cut)">
      <g opacity="0.5">
        <circle cx="1060" cy="40" r="150" fill="url(#glowC)"/>
        <circle cx="150" cy="150" r="140" fill="url(#glowV)"/>
      </g>
      <rect width="1200" height="164" fill="#060a1a" opacity="0.62"/>
      <rect width="1200" height="164" fill="url(#panel)"/>
      <rect x="-300" y="0" width="180" height="164" fill="url(#shine)" transform="skewX(-18)">
        <animate attributeName="x" values="-320;1320" dur="7s" repeatCount="indefinite"
                 calcMode="spline" keySplines="0.2 0 0.3 1" keyTimes="0;1"/>
      </rect>
    </g>

    <rect x="1" y="1" width="1198" height="162" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.3"/>
    <rect x="150" y="1.7" width="700" height="1.3" fill="#ffffff" opacity="0.42"/>

    <!-- droplet + ripples -->
    <g transform="translate(58,50)">
      <circle cx="32" cy="32" r="20" fill="#ffffff" fill-opacity="0.13" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.4"/>
      <ellipse cx="25" cy="23" rx="5.4" ry="3.4" fill="#ffffff" fill-opacity="0.9" transform="rotate(-28 25 23)"/>
      <path d="M32 6 C 32 6 44 22 44 31 A 12 12 0 0 1 20 31 C 20 22 32 6 32 6 Z" fill="#a5f3fc" fill-opacity="0.42" stroke="#e8fbff" stroke-opacity="0.8" stroke-width="1.2"/>
      <circle cx="32" cy="32" r="24" fill="none" stroke="#7dd3fc" stroke-width="1.6">
        <animate attributeName="r" values="24;46" dur="3.1s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.75;0" dur="3.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="32" cy="32" r="24" fill="none" stroke="#fbbf24" stroke-width="1.4">
        <animate attributeName="r" values="24;46" dur="3.1s" begin="1.55s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.6;0" dur="3.1s" begin="1.55s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="164" y="72" font-family="'Segoe UI',Inter,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="800" letter-spacing="-0.4" fill="url(#title)">Try the water pond — it is the real thing</text>
    <text x="164" y="104" font-family="'Segoe UI',Inter,Ubuntu,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#e0ecfa">Live WebGL refraction, spatial ocean audio, a day that sets while you play, and a droplet catch game.</text>
    <text x="164" y="132" font-family="ui-monospace,'SFMono-Regular',Consolas,monospace" font-size="14" letter-spacing="0.6" fill="#7dd3fc">wonghanz.github.io/playground</text>

    <g transform="translate(1096,82)">
      <circle r="30" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.34"/>
      <path d="M-9 -11 L 13 0 L -9 11 Z" fill="#a5f3fc">
        <animate attributeName="opacity" values="1;0.45;1" dur="2.2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
