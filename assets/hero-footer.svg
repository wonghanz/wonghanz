<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Let's build something that stays up. Contact Wong Hanz.">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03050d"/><stop offset="0.5" stop-color="#0a1030"/><stop offset="1" stop-color="#03050d"/>
    </linearGradient>
    <radialGradient id="fa"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/><stop offset="0.6" stop-color="#22d3ee" stop-opacity="0.08"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="fb"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.5"/><stop offset="0.6" stop-color="#a78bfa" stop-opacity="0.07"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <radialGradient id="fc"><stop offset="0" stop-color="#f472b6" stop-opacity="0.45"/><stop offset="0.6" stop-color="#f472b6" stop-opacity="0.06"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
    <linearGradient id="fglass" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.015"/>
    </linearGradient>
    <linearGradient id="fstroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="ftitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#a5f3fc"/><stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="fshine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.12"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="fspec"><stop offset="0" stop-color="#fff" stop-opacity="0.95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="fripple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.05"/><stop offset="0.5" stop-color="#e0f7ff" stop-opacity="0.8"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="fblur" x="-45%" y="-45%" width="190%" height="190%"><feGaussianBlur stdDeviation="26"/></filter>
    <clipPath id="fclip"><rect x="0" y="0" width="1200" height="150" rx="26"/></clipPath>
    <clipPath id="fpanel"><rect x="24" y="20" width="1152" height="110" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#fclip)">
    <rect width="1200" height="150" fill="url(#fbg)"/>
    <circle cx="150" cy="20" r="180" fill="url(#fa)">
      <animate attributeName="cx" values="150;260;150" dur="18s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </circle>
    <circle cx="1060" cy="140" r="190" fill="url(#fb)">
      <animate attributeName="cy" values="140;80;140" dur="15s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </circle>
    <circle cx="640" cy="10" r="140" fill="url(#fc)"/>

    <g clip-path="url(#fpanel)">
      <rect x="24" y="20" width="1152" height="110" fill="#060a1a" opacity="0.7"/>
      <g filter="url(#fblur)" opacity="0.4">
        <circle cx="150" cy="20" r="180" fill="url(#fa)"/>
        <circle cx="1060" cy="140" r="190" fill="url(#fb)"/>
      </g>
      <rect x="24" y="20" width="1152" height="110" fill="url(#fglass)"/>
      <rect x="-240" y="20" width="160" height="110" fill="url(#fshine)" transform="skewX(-16)">
        <animate attributeName="x" values="-260;1180" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0 0.3 1" keyTimes="0;1"/>
      </rect>
    </g>
    <rect x="24" y="20" width="1152" height="110" rx="24" fill="none" stroke="url(#fstroke)" stroke-width="1.3"/>
    <rect x="120" y="20.8" width="960" height="1.2" fill="#ffffff" opacity="0.35"/>

    <text x="600" y="66" text-anchor="middle" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="27" font-weight="800" letter-spacing="0.8" fill="url(#ftitle)">Let’s build something that stays up.</text>
    <text x="600" y="94" text-anchor="middle" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#d3e2f6">wonghanz2007@gmail.com &#183; Penang, Malaysia &#183; open to systems &amp; AIoT engineering roles and research collaborations</text>

    <!-- droplet landing in the footer, both sides -->
    <g fill="none" stroke="url(#fripple)" stroke-width="1.3">
      <ellipse cx="92" cy="104" rx="6" ry="1.6" opacity="0">
        <animate attributeName="rx" values="6;54" dur="3.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.1 0.6 0.3 1" keyTimes="0;1"/>
        <animate attributeName="ry" values="1.6;9" dur="3.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.1 0.6 0.3 1" keyTimes="0;1"/>
        <animate attributeName="opacity" values="0;0.75;0" dur="3.4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="92" cy="104" rx="6" ry="1.6" opacity="0">
        <animate attributeName="rx" values="6;54" dur="3.4s" begin="1.7s" repeatCount="indefinite" calcMode="spline" keySplines="0.1 0.6 0.3 1" keyTimes="0;1"/>
        <animate attributeName="ry" values="1.6;9" dur="3.4s" begin="1.7s" repeatCount="indefinite" calcMode="spline" keySplines="0.1 0.6 0.3 1" keyTimes="0;1"/>
        <animate attributeName="opacity" values="0;0.55;0" dur="3.4s" begin="1.7s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="1108" cy="104" rx="6" ry="1.6" opacity="0">
        <animate attributeName="rx" values="6;54" dur="3.4s" begin="0.9s" repeatCount="indefinite" calcMode="spline" keySplines="0.1 0.6 0.3 1" keyTimes="0;1"/>
        <animate attributeName="ry" values="1.6;9" dur="3.4s" begin="0.9s" repeatCount="indefinite" calcMode="spline" keySplines="0.1 0.6 0.3 1" keyTimes="0;1"/>
        <animate attributeName="opacity" values="0;0.75;0" dur="3.4s" begin="0.9s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="1108" cy="104" rx="6" ry="1.6" opacity="0">
        <animate attributeName="rx" values="6;54" dur="3.4s" begin="2.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.1 0.6 0.3 1" keyTimes="0;1"/>
        <animate attributeName="ry" values="1.6;9" dur="3.4s" begin="2.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.1 0.6 0.3 1" keyTimes="0;1"/>
        <animate attributeName="opacity" values="0;0.55;0" dur="3.4s" begin="2.6s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <g>
      <circle cx="92" cy="62" r="9" fill="#e0f7ff" opacity="0.85">
        <animate attributeName="cy" values="42;96" dur="1.7s" repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 0.9 0.6" keyTimes="0;1"/>
        <animate attributeName="opacity" values="0;0.9;0" dur="1.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1108" cy="62" r="7" fill="#e0f7ff" opacity="0.8">
        <animate attributeName="cy" values="42;96" dur="1.7s" begin="0.9s" repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 0.9 0.6" keyTimes="0;1"/>
        <animate attributeName="opacity" values="0;0.85;0" dur="1.7s" begin="0.9s" repeatCount="indefinite"/>
      </circle>
    </g>
    <rect x="0.6" y="0.6" width="1198.8" height="148.8" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
  </g>
</svg>
